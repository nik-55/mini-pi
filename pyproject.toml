[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-pi-agent"
version = "0.1.2"
description = "A minimalist coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "prompt_toolkit>=3.0.53",
    "jsonschema>=4.26.0",
]

[project.urls]
Repository = "https://github.com/nik-55/mini-pi"

[project.scripts]
minipi = "coding.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "ai", "coding"]
exclude = [
    "coding/tui",
    "*.pyc",
    "__pycache__",
]

[tool.hatch.build.targets.wheel.force-include]
"coding/tui_dist" = "coding/tui_dist"
"extensions/bundled" = "extensions/bundled"

[tool.hatch.build.targets.sdist]
exclude = [
    ".env",
    ".venv",
    ".mini-pi",
    "dist",
    "coding/tui",
    "*.pyc",
    "__pycache__"
]

[tool.hatch.build.targets.sdist.force-include]
"coding/tui_dist" = "coding/tui_dist"
"extensions/bundled" = "extensions/bundled"
