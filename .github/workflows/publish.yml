name: Publish to PyPI

on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build TUI bundle
        working-directory: coding/tui
        run: |
          npm ci
          npm run bundle

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      
      - name: Build wheel
        run: uv build --python 3.14
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
